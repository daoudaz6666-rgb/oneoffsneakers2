<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ONE OFF SNEAKERS — Chaussures homme & femme</title>
  <meta name="description" content="ONE OFF SNEAKERS : baskets, sandales, mocassins et bottes pour homme et femme. Classés par marque et par modèle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/logo-oneoff.png">
</head>
<body>
  <!-- Loader d'intro -->
  <div id="loader" aria-hidden="true">
    <div class="loader-inner">
      <img class="loader-logo" src="img/logo-oneoff.png" alt="">
      <div class="loader-word"><span>ONE</span><span>OFF</span></div>
      <div class="loader-sub">SNEAKERS</div>
      <div class="loader-bar"><i></i></div>
    </div>
  </div>
  <div class="noise" aria-hidden="true"></div>

  <div class="announce"><div class="announce-track" id="announce"></div></div>

  <header class="site-header" id="header">
    <a href="#/" class="logo" aria-label="Accueil ONE OFF SNEAKERS">
      <img class="logo-img" src="img/logo-oneoff.png" alt="">
      <span class="logo-text"><b>ONE OFF</b><small>SNEAKERS</small></span>
    </a>
    <nav class="main-nav" id="mainNav">
      <a href="#/" data-nav="home">Accueil</a>
      <div class="nav-drop">
        <a href="#/catalogue?genre=homme" data-nav="homme">Homme <span class="caret">▾</span></a>
        <div class="mega mega-g" id="megaHomme"></div>
      </div>
      <div class="nav-drop">
        <a href="#/catalogue?genre=femme" data-nav="femme">Femme <span class="caret">▾</span></a>
        <div class="mega mega-g" id="megaFemme"></div>
      </div>
      <div class="nav-drop">
        <a href="#/marques" data-nav="marques">Marques <span class="caret">▾</span></a>
        <div class="mega" id="megaBrands"></div>
      </div>
      <a href="#/catalogue?tri=recent" data-nav="nouveautes">Nouveautés</a>
      <a href="#/catalogue?promo=1" data-nav="promos">Promotions</a>
      <a href="#/catalogue" data-nav="catalogue">Tout voir</a>
    </nav>
    <div class="header-actions">
      <button class="hsearch" id="hSearch" aria-label="Rechercher une marque, un modèle">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>Rechercher une marque, un modèle…</span>
      </button>
      <button class="icon-btn" id="searchBtn" aria-label="Rechercher">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button class="icon-btn fav-head" id="favBtn" aria-label="Favoris">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-9.2-8.6C1.3 8.4 3 5 6.4 5c2 0 3.3 1.1 4.1 2.4h3C14.3 6.1 15.6 5 17.6 5 21 5 22.7 8.4 21.2 11.4 19 15.6 12 20 12 20z"/></svg>
        <span class="cart-count" id="favCount">0</span>
      </button>
      <button class="icon-btn cart-btn" id="cartBtn" aria-label="Panier">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14l-1.2 12.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 7V6a3 3 0 0 1 6 0v1"/></svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
      <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <div class="ann2" id="ann2"></div>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer" id="footer"></footer>

  <!-- Recherche -->
  <div class="search-overlay" id="searchOverlay" aria-hidden="true">
    <button class="search-close" id="searchClose" aria-label="Fermer">✕</button>
    <div class="search-box">
      <input id="searchInput" type="search" placeholder="Marque, modèle, style…" autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <!-- Panier -->
  <div class="drawer-backdrop" id="backdrop"></div>
  <aside class="cart-drawer" id="cartDrawer" aria-label="Panier">
    <header><div class="drawer-tabs" role="tablist"><button class="on" data-dtab="cart" role="tab">Panier <em id="dtCart"></em></button><button data-dtab="fav" role="tab">Favoris <em id="dtFav"></em></button></div><button class="icon-btn" id="cartClose" aria-label="Fermer">✕</button></header>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-items" id="favItems" hidden></div>
    <footer class="cart-foot" id="cartFoot"></footer>
  </aside>

  <!-- Menu mobile -->
  <aside class="mm" id="mobileMenu" aria-label="Menu">
    <header class="mm-head"><div class="mm-tabs"><button class="on" data-mm="homme">Homme</button><button data-mm="femme">Femme</button></div><button class="icon-btn" id="mmClose" aria-label="Fermer">✕</button></header>
    <div class="mm-body" id="mmBody"></div>
  </aside>

  <div class="toasts" id="toasts"></div>

  <script src="js/shoe-art.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
